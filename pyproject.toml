[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slurdletwo"
version = "0.2.0"
description = "it's like wordle but for slurs also not rly that like wordle it's just a fun pun"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4",
  "flask",
  "flask-assets",
  "flask-sqlalchemy>=3.1.1",
  "google-genai>=2.25.0",
  "gunicorn>=26.2.0",
  "libsass",
  "lxml",
  "pandas",
  "pandas-stubs",
  "pydantic>=2.13.5",
  "pyrefly>=1.3.1",
  "requests",
  "ruff",
  "scikit-learn",
  "sentence-transformers",
  "typesafe-sdk>=0.7.5",
]

[project.scripts]
slurdle = "slurdletwo.cli:main"

[dependency-groups]
dev = [
  "playwright>=1.64.1",
  "pytest>=9.1.1",
  "pytest-flask>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slurdletwo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = ["F401"]
