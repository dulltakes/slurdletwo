[project]
name = "slurdletwo"
version = "0.1.0"
description = "it's like wordle but for slurs also not rly that like wordle it's just a fun pun"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4",
  "flask",
  "flask-assets",
  "flask-sqlalchemy>=3.1.1",
  "google-genai>=2.25.0",
  "libsass",
  "lxml",
  "pandas",
  "pandas-stubs",
  "pydantic>=2.13.5",
  "pyrefly>=1.3.1",
  "requests",
  "ruff",
  "scikit-learn",
  "sentence-transformers",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = ["F401"]

[tool.pyright]
executionEnvironments = [
  { root = "." }
]
