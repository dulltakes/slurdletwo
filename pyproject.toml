[project]
name = "slurdletwo"
version = "0.1.0"
description = "it's like wordle but for slurs also not rly that like wordle it's just a fun pun"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4",
  "flask",
  "flask-assets",
  "libsass",
  "lxml",
  "pandas",
  "pandas-stubs",
  "requests",
  "ruff",
  "scikit-learn",
  "sentence-transformers",
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = ["F401"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "tests"
]
